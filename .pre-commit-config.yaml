repos:
  # Base checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml

  # ISORT (sort imports).
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length=120"]

  # FLAKE8 (camelCase and 120 symbols).
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [
          "--max-line-length=120",
          "--indent-size=2",
          "--extend-ignore=E203,W503,N802,N803,N806",
          "--extend-ignore=E111,E114,E302,E305,E501",
          "--extend-ignore=F401,F841,E231,E127",
          "--extend-ignore=W292,E251,E303,W391,E225,F811"
        ]

  # MYPY (check the types).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "pydantic"
          - "redis"
          - "types-redis"
        args: ["--ignore-missing-imports"]
