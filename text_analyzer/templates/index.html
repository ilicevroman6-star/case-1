<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор текста</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 150px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; background-color: #f8f9fa; border: 1px solid #e9ecef; }
        pre { white-space: pre-wrap; word-wrap: break-word; font-family: monospace; }
    </style>
</head>
<body>
    <h2>📝 Анализатор текста</h2>
    <p>Введите текст ниже, чтобы узнать язык, количество слогов и эмоциональный окрас:</p>

    <textarea id="textInput" placeholder="Введите ваш текст здесь..."></textarea>
    <button onclick="analyzeText()">Анализировать</button>

    <div id="result">
        <h3>📊 Результат анализа:</h3>
        <pre id="output"></pre>
    </div>

    <script>
        async function analyzeText() {
            const text = document.getElementById('textInput').value;
            const resultDiv = document.getElementById('result');
            const outputPre = document.getElementById('output');

            if (!text.trim()) {
                alert('Пожалуйста, введите текст');
                return;
            }

            outputPre.innerText = "Загрузка...";
            resultDiv.style.display = 'block';

            try {
                // Отправляем POST-запрос на ваш рабочий эндпоинт /analyze
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (response.ok) {
                    // Выводим красивый отформатированный JSON на страницу
                    outputPre.innerText = JSON.stringify(data, null, 2);
                } else {
                    outputPre.innerText = `Ошибка: ${data.detail || 'Что-то пошло не так'}`;
                }
            } catch (error) {
                outputPre.innerText = `Ошибка соединения с сервером: ${error.message}`;
            }
        }
    </script>
</body>
</html>
