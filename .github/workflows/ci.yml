name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest text_analyzer/tests/ -v

      - name: Run flake8
        run: |
          pip install flake8
          flake8 text_analyzer/ --max-line-length=120 --extend-ignore=E203,W503,N802,N803,N806,E111,E114,E302,E305,E501,F401,F841,E231,E127
